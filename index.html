<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Lock zoom/scroll so touch-drag isn't hijacked by Safari -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>X01 Radial Scorer — Prototype</title>
  <style>
    :root {
      --blue-dark: #1c5d77;
      --blue-mid:  #5bc0e8;
      --blue-ring: #cfeefc;
      --green-disc:#cfe9c8;
      --green-bub: #2f7d32;
      --pink:      #e8217f;
      --frame:     #103a4a;
      --text:      #1a1a1a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #e9eef1; color: var(--text);
      overscroll-behavior: none;
    }
    /* phone-ish frame, but fills the screen on an actual phone */
    .frame {
      max-width: 560px; margin: 0 auto; height: 100dvh; overflow: hidden;
      background: #fff;
      padding: 6px 4px 8px; display: flex; flex-direction: column; gap: 6px;
    }

    /* ---------- header scoreboard ---------- */
    .scoreboard {
      border: 3px solid var(--frame); border-radius: 14px;
      padding: 5px 5px; display: grid;
      grid-template-columns: 1fr auto 1fr; gap: 4px; align-items: stretch;
    }

    /* a player panel: history column + main (remaining + actual throw) */
    .panel { display: flex; gap: 3px; }
    .panel.opp    { --c: #9a9a9a; justify-content: flex-start; }
    .panel.player { --c: var(--pink); justify-content: flex-end; }

    .hist-col { display: flex; flex-direction: column; gap: 3px; }
    .hist-box {
      position: relative; border: 2px solid var(--c); border-radius: 7px;
      min-width: 52px; height: 28px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: var(--c);
    }
    .hist-box.empty { border-color: #ccc; }
    /* dart-count badge — small circle at the top-right corner */
    .darts {
      position: absolute; top: -7px; right: -5px;
      min-width: 16px; height: 16px; padding: 0 2px; border-radius: 50%;
      background: #fff; border: 1.5px solid var(--c); color: var(--c);
      font-size: 9px; font-weight: 700; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .hist-box[data-vi], .actual-box[data-vi] { cursor: pointer; }
    /* selected-for-edit highlight */
    .hist-box.selected, .actual-box.selected { background: var(--c); color: #fff; }
    .actual-box.selected .val { color: #fff; }

    .main-col { display: flex; flex-direction: column; gap: 3px; }
    .big-rem {
      border: 2px solid var(--c); border-radius: 9px; padding: 1px 6px;
      font-size: 34px; font-weight: 800; color: var(--c); text-align: center; line-height: 1.1;
    }
    .actual-box {
      position: relative; border: 2px solid var(--c); border-radius: 9px; padding: 3px 6px;
      color: var(--c); text-align: center; line-height: 1;
    }
    .actual-box .val { font-size: 25px; font-weight: 800; }

    /* middle: sets / legs */
    .mid-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .mid-title  { font-size: 11px; font-weight: 700; color: var(--blue-dark); white-space: nowrap; }
    .mid-boxes  { display: flex; gap: 4px; }
    .mid-box    { background: var(--frame); color: #fff; border-radius: 7px; min-width: 23px; height: 24px;
                  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .mid-box.leg { background: #1f7fa6; }
    .mid-divider { width: 100%; height: 1px; background: #ccc; margin: 3px 0; }

    /* ---------- radial area ---------- */
    .radial-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
    svg { width: 100%; height: 100%; display: block; touch-action: none; }

    /* ---------- remaining-score toggle ---------- */
    .rem-toggle {
      position: absolute; top: 23px; right: 38px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: var(--blue-dark); color: #fff;
      border: none; border-radius: 12px;
      padding: 7px 11px 6px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      cursor: pointer; user-select: none;
      opacity: 0.55; transition: opacity 0.15s, background 0.15s;
    }
    .rem-toggle.active {
      background: var(--pink); opacity: 1;
    }
    .rem-toggle__dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: background 0.15s;
    }
    .rem-toggle.active .rem-toggle__dot { background: #fff; }

    .seg-line { stroke: var(--blue-dark); stroke-width: 1.4; }
    .seg-num  { font-size: 26px; font-weight: 700; fill: #fff;
      text-anchor: middle; }
    .seg-num-active { font-size: 28px; font-weight: 800; fill: #fff; }
    .bubble   { fill: var(--green-bub); stroke: #1d5a20; stroke-width: 2; }
    .bubble-active { fill: #3aa33f; stroke: #0f3d12; stroke-width: 3; }
    .bubble-text { fill: #fff; font-size: 26px; font-weight: 700;
      text-anchor: middle; dominant-baseline: central; }
    .center-num { fill: var(--text); font-size: 60px; font-weight: 700;
      text-anchor: middle; dominant-baseline: central; }


    /* ---------- win overlay ---------- */
    .win-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 99;
    }
    .win-card {
      background: #fff; border-radius: 20px; padding: 32px 40px;
      text-align: center;
    }
    .win-card h2 { font-size: 2.2rem; margin: 0 0 8px; }
    .win-card p  { color: #555; margin: 0 0 20px; }
    .win-card button {
      background: var(--blue-dark); color: #fff; border: none;
      border-radius: 12px; padding: 10px 28px; font-size: 16px; font-weight: 700; cursor: pointer;
    }

    /* ---------- footer ---------- */
    .back {
      align-self: center; background: var(--blue-dark); color: #fff; border: none;
      border-radius: 14px; padding: 9px 34px; font-size: 17px; font-weight: 700;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="frame">

    <!-- ===== header scoreboard ===== -->
    <div class="scoreboard">

      <!-- opponent (left, gray) — static placeholder in solo prototype -->
      <div class="panel opp">
        <div class="hist-col">
          <div class="hist-box">60<span class="darts">12</span></div>
          <div class="hist-box">100<span class="darts">9</span></div>
          <div class="hist-box">60<span class="darts">6</span></div>
          <div class="hist-box">40<span class="darts">3</span></div>
        </div>
        <div class="main-col">
          <div class="big-rem">141</div>
          <div class="actual-box"><span class="val">100</span><span class="darts">15</span></div>
        </div>
      </div>

      <!-- middle: sets / legs -->
      <div class="mid-col">
        <div class="mid-title">1 of 1 sets</div>
        <div class="mid-boxes">
          <div class="mid-box">11</div><div class="mid-box">11</div>
        </div>
        <div class="mid-divider"></div>
        <div class="mid-title">23 of 29 legs</div>
        <div class="mid-boxes">
          <div class="mid-box leg">11</div><div class="mid-box leg">12</div>
        </div>
      </div>

      <!-- player (right, magenta) — wired to live state -->
      <div class="panel player">
        <div class="main-col">
          <div class="big-rem" id="playerRemaining">501</div>
          <div class="actual-box" id="actualBox">
            <span class="val" id="scoreVal">–</span>
            <span class="darts" id="actualDarts"></span>
          </div>
        </div>
        <div class="hist-col" id="histCol"></div>
      </div>
    </div>

    <!-- ===== radial scorer (generated by JS) ===== -->
    <div class="radial-wrap">
      <button class="rem-toggle" id="remToggle" aria-pressed="false" title="Toggle remaining score">
        <span class="rem-toggle__dot"></span>
        REM
      </button>
      <svg id="scorer" viewBox="0 0 600 790" aria-label="radial score selector"></svg>
    </div>

    <!-- ===== footer ===== -->
    <button class="back" id="undoBtn">UNDO</button>
  </div>

  <script>
  // =========================================================================
  //  TUNING CONSTANTS  — tweak these, refresh, re-check on the phone.
  //  Geometry is parametric so the whole dial reshapes from here.
  // =========================================================================
  const T = {
    cx: 300, cy: 395,          // dial center within the 600x790 viewBox

    // outer number ring (ellipse) — measured, then +20% wider / +10% taller
    ringOuterRx: 298, ringOuterRy: 384,   // outer edge of the blue band
    ringInnerRx: 167, ringInnerRy: 256,   // inner edge of the blue band (= green disc edge)
    numRx: 227, numRy: 325,               // where the 20 numbers sit (mid-band)
    segCount: 20,                          // exact values shown per range
    startAngleDeg: -81,                    // first segment centre 9° right of top → segment boundary on vertical

    // green inner disc — narrow + tall (big blue band), per the picture
    discRx: 167, discRy: 256,
    bubbleR: 48,                           // bubble radius
    bubbleCount: 10,
  };

  // The 10 score ranges. 0-9 is the rarely-used centre bubble (labeled "0").
  // All other buckets are 20 values wide: lower half on the left ring arc,
  // upper half on the right arc, both reading bottom-to-top.
  // RANGES[i] maps 1-to-1 to BUBBLE_POS[i].
  const RANGES = [
    "150-169",  // 0  (300,450) centre
    "170-180",  // 1  (300,332) upper-centre
    "110-129",  // 2  (384,261) upper-right
    "70-89",    // 3  (409,395) right
    "30-49",    // 4  (386,527) lower-right
    "0-9",      // 5  (300,613) bottom
    "130-149",  // 6  (300,177) top
    "10-29",    // 7  (214,527) lower-left
    "50-69",    // 8  (191,395) left
    "90-109",   // 9  (216,261) upper-left
  ];

  // Bubble centres (viewBox coords). Centre bubble + 9 outer at ~40° intervals.
  // Bottom pair spread wider so adjacent bubbles don't overlap (r=44).
  const BUBBLE_POS = [
    { x: 300, y: 450 },  // 0-9     (centre)
    { x: 300, y: 332 },  // 10-29
    { x: 389, y: 264 },  // 30-49
    { x: 419, y: 395 },  // 50-69
    { x: 391, y: 524 },  // 70-89
    { x: 300, y: 603 },  // 90-109  (bottom of disc, centre)
    { x: 300, y: 187 },  // 110-129 (top of disc, centre)
    { x: 209, y: 524 },  // 130-149
    { x: 181, y: 395 },  // 150-169
    { x: 211, y: 264 },  // 170-180
  ];

  // How far out (normalized to the number ring = 1.0) the finger must be to
  // count as "selecting a segment". Below this = inner/dead zone = no value.
  const SELECT_THRESHOLD = 0.80;
  const GRAB_SLOP = 1.35;   // bubble tap forgiveness multiplier

  const START = 501;     // leg starting score

  // --- live interaction state ---
  const STATE = {
    activeRange: null,   // index 0..9 of the range whose values fill the ring
    dragging: false,
    previewIdx: null,    // ring segment under the finger (0..19) or null
    lastScore: null,
    remaining: START,    // running 501 countdown
    visits: [],          // { score, bust, after } — full visit log
    dragPos: null,       // live pointer pos — the held bubble follows it
    settleScore: null,   // committed score shown on the bubble during its 500ms linger
    editIndex: null,     // visit index selected for overwrite (click a throw box)
  };

  // =========================================================================
  const svg = document.getElementById("scorer");
  const scoreEl = document.getElementById("scoreVal");
  const NS = "http://www.w3.org/2000/svg";
  const deg = d => d * Math.PI / 180;
  const step  = 360 / T.segCount;       // angle per ring segment
  const bstep = 360 / T.bubbleCount;    // angle per range bubble

  function el(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  // point on an ellipse at parametric angle a (deg)
  function ptOnEllipse(rx, ry, aDeg) {
    const a = deg(aDeg);
    return { x: T.cx + rx * Math.cos(a), y: T.cy + ry * Math.sin(a) };
  }
  // point where the ray at TRUE angle θ (deg, from centre) meets the ellipse.
  // Dividing by equal true angle gives visually equal pie-slice cells.
  function ptOnEllipseTrue(rx, ry, thetaDeg) {
    const a = deg(thetaDeg), c = Math.cos(a), s = Math.sin(a);
    const k = 1 / Math.sqrt((c * c) / (rx * rx) + (s * s) / (ry * ry));
    return { x: T.cx + k * c, y: T.cy + k * s };
  }
  function bubbleCenter(i) { return BUBBLE_POS[i]; }
  // intersection point of line (p1,p2) and line (p3,p4)
  function lineIntersect(p1, p2, p3, p4) {
    const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
    const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
    return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
  }

  // n points equally spaced by ARC LENGTH around an ellipse, starting at startDeg.
  function equalArcPoints(rx, ry, n, startDeg) {
    const SAMPLES = 4000;
    const pt = (aDeg) => { const a = deg(aDeg); return { x: T.cx + rx*Math.cos(a), y: T.cy + ry*Math.sin(a) }; };
    const cum = [{ s: 0, p: pt(startDeg) }];
    let prev = cum[0].p, total = 0;
    for (let i = 1; i <= SAMPLES; i++) {
      const p = pt(startDeg + 360 * i / SAMPLES);
      total += Math.hypot(p.x - prev.x, p.y - prev.y);
      cum.push({ s: total, p }); prev = p;
    }
    const out = [];
    let j = 0;
    for (let k = 0; k < n; k++) {
      const target = k * total / n;
      while (j < cum.length - 1 && cum[j + 1].s < target) j++;
      const a = cum[j], b = cum[j + 1] || cum[j];
      const f = b.s > a.s ? (target - a.s) / (b.s - a.s) : 0;
      out.push({ x: a.p.x + f * (b.p.x - a.p.x), y: a.p.y + f * (b.p.y - a.p.y) });
    }
    return out;
  }

  // Ring boundary points: inner + outer ellipses each split into 20 equal
  // arc-length pieces, starting at the top (so a boundary sits on the vertical).
  function computeRing() {
    const startB = T.startAngleDeg - (360 / T.segCount) / 2;   // first boundary at top
    return {
      inner: equalArcPoints(T.ringInnerRx, T.ringInnerRy, T.segCount, startB),
      outer: equalArcPoints(T.ringOuterRx, T.ringOuterRy, T.segCount, startB),
    };
  }
  const RING = computeRing();

  // standard ray-cast point-in-polygon
  function pointInPoly(p, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
      if (((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  // corners of cell i (inner→inner→outer→outer)
  function cellCorners(i) {
    const n = (i + 1) % T.segCount;
    return [RING.inner[i], RING.inner[n], RING.outer[n], RING.outer[i]];
  }

  // exact values for the active range, e.g. 40..59
  function rangeValues(idx) {
    if (idx == null) return [];
    const [lo, hi] = RANGES[idx].split("-").map(Number);
    const vals = [];
    for (let v = lo; v <= hi; v++) vals.push(v);
    return vals;
  }

  // Map a flat sorted vals array onto the 20 ring segments.
  // Lower values → upper arc (left→right), higher values → bottom arc (left→right).
  function buildSegmentValues(vals, rangeStr) {
    const result     = new Array(T.segCount).fill(null);
    const bottomSegs = [14,13,12,11,10,9,8,7,6,5];
    const upperSegs  = [15,16,17,18,19,0,1,2,3,4];

    if (rangeStr === "0-9") {
      // All 10 on the bottom arc only
      bottomSegs.forEach((seg, j) => { result[seg] = vals[j]; });
      return result;
    }

    if (rangeStr === "170-180") {
      // 170-179 fill all 10 upper slots; 180 sits at the first bottom slot
      upperSegs.forEach((seg, j) => { result[seg] = vals[j]; });
      result[bottomSegs[0]] = vals[10];
      return result;
    }

    // Default: lower half on upper arc, higher half on bottom arc
    const half = Math.floor(vals.length / 2);
    upperSegs .forEach((seg, j) => { if (j < half)              result[seg] = vals[j]; });
    bottomSegs.forEach((seg, j) => { if (j < vals.length - half) result[seg] = vals[half + j]; });
    return result;
  }

  // ----- pointer → SVG viewBox coordinates -----
  function toLocal(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  // which range bubble (if any) is under a point
  function bubbleAt(p) {
    for (let i = 0; i < T.bubbleCount; i++) {
      const c = bubbleCenter(i);
      if (Math.hypot(p.x - c.x, p.y - c.y) <= T.bubbleR * GRAB_SLOP) return i;
    }
    return null;
  }
  // which ring segment (if any) a point maps to — test against each cell quad.
  function segmentAt(p) {
    for (let i = 0; i < T.segCount; i++) {
      if (pointInPoly(p, cellCorners(i))) return i;
    }
    return null;                                    // inner disc / outside = no value
  }

  // draw one range bubble at a given centre. labelOverride (e.g. a recorded
  // score) replaces the usual two-decade label when provided.
  function drawBubble(i, p, labelOverride) {
    svg.appendChild(el("circle", {
      cx: p.x, cy: p.y, r: T.bubbleR,
      class: i === STATE.activeRange ? "bubble bubble-active" : "bubble"
    }));
    // Only the settling bubble (with its score override) shows a label while a
    // drag is in progress or a drop is still settling; everything else is blank.
    if (labelOverride == null && (STATE.dragging || STATE.settleScore != null)) return;
    const t = el("text", { x: p.x, y: p.y, class: "bubble-text" });
    // Decade label with the trailing 0 replaced by * (10 → "1*", 180 → "18*", 0 → "*")
    const decade = (n) => String(n).slice(0, -1) + "*";
    if (labelOverride != null) {
      t.appendChild(el("tspan", { x: p.x, dy: "0.05em" }, String(labelOverride)));
    } else if (RANGES[i] === "0-9") {
      t.appendChild(el("tspan", { x: p.x, dy: "0.05em" }, decade(0)));
    } else {
      const lo = Number(RANGES[i].split("-")[0]);
      t.appendChild(el("tspan", { x: p.x, dy: "-0.45em" }, decade(lo)));
      t.appendChild(el("tspan", { x: p.x, dy: "1.0em" },  decade(lo + 10)));
    }
    svg.appendChild(t);
  }

  // =========================== RENDER =====================================
  function render() {
    svg.innerHTML = "";
    const vals = rangeValues(STATE.activeRange);
    const segVals = buildSegmentValues(vals, RANGES[STATE.activeRange]);

    // 1) ring cells — each drawn as its own trapezoid (inner arc → outer arc).
    //    A white stroke-width:3 on each cell yields a uniform 3-unit gap between
    //    neighbours; the upper arc (i=0..4, 15..19) is a darker blue.
    const upperSet = new Set([15,16,17,18,19,0,1,2,3,4]);
    for (let i = 0; i < T.segCount; i++) {
      const n = (i + 1) % T.segCount;
      const iL = RING.inner[i], iR = RING.inner[n];
      const oL = RING.outer[i], oR = RING.outer[n];
      const d = `M ${iL.x} ${iL.y}`
              + ` A ${T.ringInnerRx} ${T.ringInnerRy} 0 0 1 ${iR.x} ${iR.y}`
              + ` L ${oR.x} ${oR.y}`
              + ` A ${T.ringOuterRx} ${T.ringOuterRy} 0 0 0 ${oL.x} ${oL.y}`
              + ` Z`;
      const isSel = STATE.dragging && STATE.previewIdx === i && segVals[i] != null;
      svg.appendChild(el("path", {
        d,
        fill: isSel ? "var(--green-bub)" : (upperSet.has(i) ? "#5a9bd4" : "#34719e"),
        stroke: "#fff", "stroke-width": 3, "stroke-linejoin": "round"
      }));
    }

    // 3) white inner disc (no outline)
    svg.appendChild(el("ellipse", {
      cx: T.cx, cy: T.cy, rx: T.discRx, ry: T.discRy,
      fill: "#fff", stroke: "none"
    }));

    // 4) exact-value numbers — only while a bubble is being dragged. The
    //    selected cell's number is omitted; it is shown on the bubble instead.
    for (let i = 0; STATE.dragging && i < T.segCount; i++) {
      if (segVals[i] == null) continue;
      if (STATE.previewIdx === i) continue;   // number moves onto the bubble
      // Cell centre = average of its four boundary corners.
      const c = cellCorners(i);
      const p = {
        x: (c[0].x + c[1].x + c[2].x + c[3].x) / 4,
        y: (c[0].y + c[1].y + c[2].y + c[3].y) / 4,
      };
      svg.appendChild(el("text", {
        x: p.x, y: p.y,
        'text-anchor': 'middle', dy: '0.35em',
        class: "seg-num"
      }, segVals[i]));
    }

    // 5) range bubbles
    // Non-active bubbles first, then the active one on top — at the live pointer
    // position while dragging, so the held bubble follows the finger.
    for (let i = 0; i < T.bubbleCount; i++) {
      if (i === STATE.activeRange) continue;
      drawBubble(i, bubbleCenter(i));
    }
    if (STATE.activeRange != null) {
      const home = bubbleCenter(STATE.activeRange);
      const p = STATE.dragPos || home;   // held / settling → drop pos; else home
      // While over a cell, show that cell's number on the bubble; while settling
      // on a scored drop, show the recorded score; otherwise the range label.
      let override = null;
      if (STATE.dragging && STATE.previewIdx != null) override = segVals[STATE.previewIdx];
      else if (STATE.settleScore != null) override = STATE.settleScore;
      drawBubble(STATE.activeRange, p, override);
    }

    // 6) centre "Score:" shows last committed throw; previews current cell while dragging
    let scoreTxt = STATE.lastScore != null ? String(STATE.lastScore) : "–";
    if (STATE.dragging && STATE.previewIdx != null) {
      const v = segVals[STATE.previewIdx];
      if (v != null) scoreTxt = String(v);
    }
    scoreEl.style.color = "";
    scoreEl.textContent = scoreTxt;
  }

  // =========================== GESTURE ====================================
  svg.addEventListener("pointerdown", (e) => {
    const p = toLocal(e);
    const b = bubbleAt(p);
    if (b == null) return;            // only a range bubble starts a throw
    e.preventDefault();
    if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }  // cancel pending snap-home
    STATE.settleScore = null;
    try { svg.setPointerCapture(e.pointerId); } catch {}
    STATE.activeRange = b;
    STATE.dragging = true;
    STATE.previewIdx = null;
    STATE.dragPos = p;                // bubble jumps to the finger
    render();
  });

  svg.addEventListener("pointermove", (e) => {
    if (!STATE.dragging) return;
    e.preventDefault();
    STATE.dragPos = toLocal(e);       // held bubble follows the finger
    STATE.previewIdx = segmentAt(STATE.dragPos);
    render();                         // re-render every move so the bubble tracks
  });

  let settleTimer = null;             // pending "snap bubble home" timeout

  function endDrag(e) {
    if (!STATE.dragging) return;
    const segVals = buildSegmentValues(rangeValues(STATE.activeRange), RANGES[STATE.activeRange]);
    const committed = (STATE.previewIdx != null) ? segVals[STATE.previewIdx] : null;

    if (committed != null) {
      if (STATE.editIndex != null && STATE.editIndex < STATE.visits.length) {
        // Overwrite the selected throw, then replay the leg from the start.
        STATE.visits[STATE.editIndex].score = committed;
        STATE.editIndex = null;
        recompute();
        if (navigator.vibrate) navigator.vibrate(15);
      } else {
        const newRem = STATE.remaining - committed;
        const bust   = newRem < 0;
        if (!bust) STATE.remaining = newRem;
        STATE.visits.push({ score: committed, bust, after: STATE.remaining });
        STATE.lastScore = committed;
        if (navigator.vibrate) navigator.vibrate(bust ? [20,30,20] : 15);
      }
      updateHistory();
      if (STATE.remaining === 0) handleWin();
    }

    STATE.dragging = false;
    STATE.previewIdx = null;
    try { svg.releasePointerCapture(e.pointerId); } catch {}

    // Dropped on a scoring cell → bubble rests there 500ms showing the recorded
    // score, then snaps home. Non-scoring area → snap home immediately.
    if (committed != null) {
      STATE.settleScore = committed;
      settleTimer = setTimeout(() => {
        settleTimer = null;
        STATE.dragPos = null;
        STATE.settleScore = null;
        render();
      }, 700);
    } else {
      STATE.dragPos = null;
      STATE.settleScore = null;
    }
    render();
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  // stop iOS long-press from popping a callout / cancelling the drag
  svg.addEventListener("contextmenu", (e) => e.preventDefault());

  // ========================= HISTORY / UNDO / WIN ============================
  const undoBtn = document.getElementById("undoBtn");

  const playerRemainingEl = document.getElementById("playerRemaining");
  const actualDartsEl     = document.getElementById("actualDarts");
  const histColEl         = document.getElementById("histCol");
  const actualBoxEl       = document.getElementById("actualBox");

  // Replay all visit scores from START, refreshing each visit's bust/after and
  // the running remaining (used after an in-place edit).
  function recompute() {
    let rem = START;
    STATE.visits.forEach(v => {
      const next = rem - v.score;
      v.bust = next < 0;
      if (!v.bust) rem = next;
      v.after = rem;
    });
    STATE.remaining = rem;
    STATE.lastScore = STATE.visits.length ? STATE.visits[STATE.visits.length - 1].score : null;
  }

  function updateHistory() {
    const n = STATE.visits.length;

    // Big number = remaining score
    playerRemainingEl.textContent = String(STATE.remaining);

    // Actual-throw box = latest visit (index n-1): darts + edit wiring
    actualDartsEl.textContent = n ? `${n * 3}` : "";
    actualDartsEl.style.display = n ? "" : "none";
    if (n) { actualBoxEl.dataset.vi = n - 1; } else { delete actualBoxEl.dataset.vi; }
    actualBoxEl.classList.toggle("selected", STATE.editIndex === n - 1 && n > 0);
    // (the throw value itself is written by render() so it also previews on drag)

    // History column = previous visits (newest at top), 4 slots, with cumulative darts
    const slots = [];
    for (let k = n - 2; k >= 0 && slots.length < 4; k--) {
      const v = STATE.visits[k];
      const sel = STATE.editIndex === k ? " selected" : "";
      slots.push(`<div class="hist-box${sel}" data-vi="${k}">${v.bust ? "✗" : v.score}<span class="darts">${(k + 1) * 3}</span></div>`);
    }
    while (slots.length < 4) slots.push(`<div class="hist-box empty"></div>`);
    histColEl.innerHTML = slots.join("");

    undoBtn.disabled = STATE.visits.length === 0;
    undoBtn.style.opacity = STATE.visits.length === 0 ? "0.35" : "";
  }
  updateHistory();   // initial empty history

  // Click a throw box → toggle it as the edit target; the next dial commit
  // overwrites that throw instead of adding a new one.
  document.querySelector(".panel.player").addEventListener("click", (e) => {
    const box = e.target.closest("[data-vi]");
    if (!box) return;
    const vi = Number(box.dataset.vi);
    STATE.editIndex = (STATE.editIndex === vi) ? null : vi;
    updateHistory();
  });

  undoBtn.addEventListener("click", () => {
    if (STATE.visits.length === 0) return;
    STATE.visits.pop();
    STATE.editIndex = null;
    recompute();
    updateHistory();
    render();
  });

  function handleWin() {
    const overlay = document.createElement("div");
    overlay.className = "win-overlay";
    overlay.innerHTML = `
      <div class="win-card">
        <h2>🎯 Checkout!</h2>
        <p>You finished 501 in ${STATE.visits.length} visit${STATE.visits.length !== 1 ? "s" : ""}.</p>
        <button id="winClose">Play again</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("#winClose").addEventListener("click", () => {
      STATE.remaining = START;
      STATE.visits = [];
      STATE.editIndex = null;
      STATE.lastScore = null;
      overlay.remove();
      updateHistory();
      render();
    });
  }

  render();

  // Remaining-score toggle (behaviour wired up later)
  const remToggle = document.getElementById("remToggle");
  remToggle.addEventListener("click", () => {
    const on = remToggle.classList.toggle("active");
    remToggle.setAttribute("aria-pressed", on);
  });
  </script>
</body>
</html>
