<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Lock zoom/scroll so touch-drag isn't hijacked by Safari -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>X01 Radial Scorer — Prototype</title>
  <style>
    :root {
      --blue-dark: #1c5d77;
      --blue-mid:  #5bc0e8;
      --blue-ring: #cfeefc;
      --green-disc:#cfe9c8;
      --green-bub: #2f7d32;
      --pink:      #e8217f;
      --frame:     #103a4a;
      --text:      #1a1a1a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #e9eef1; color: var(--text);
      overscroll-behavior: none;
    }
    /* phone-ish frame, but fills the screen on an actual phone */
    .frame {
      max-width: 560px; margin: 0 auto; height: 100dvh; overflow: hidden;
      background: #fff;
      padding: 6px 4px 8px; display: flex; flex-direction: column; gap: 6px;
    }

    /* ---------- header scoreboard ---------- */
    .scoreboard {
      border: 3px solid var(--frame); border-radius: 14px;
      padding: 5px 12px 7px; display: grid;
      grid-template-columns: 1fr auto 1fr; align-items: start; gap: 6px;
    }
    .sb-title { grid-column: 1 / -1; text-align: center; font-weight: 700;
      text-decoration: underline; font-size: 15px; margin-bottom: 0; }
    .opp-name { font-size: 20px; font-weight: 700; letter-spacing: 1px; line-height: 1.05; }
    .player-name { font-size: 30px; font-weight: 800; color: var(--pink); line-height: 1; }
    .sub { font-size: 11px; line-height: 1.25; color: #333; }
    .side-left { text-align: left; }
    .side-right { text-align: right; }
    .legbox {
      display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
      border: 2px solid var(--blue-dark); border-radius: 6px; overflow: hidden;
      font-size: 14px; font-weight: 700; min-width: 64px;
    }
    .legbox span { padding: 2px 6px; }
    .legbox .l { background: #eef6fb; color: var(--text); }
    .legbox .r { background: #eef6fb; color: var(--pink); }
    .esc {
      background: var(--blue-dark); color: #fff; border: none; border-radius: 10px;
      padding: 5px 12px; font-size: 14px; font-weight: 700;
    }

    /* ---------- score readout (inside header, under the leg box) ---------- */
    .center-col { display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .score-inline { display: flex; flex-direction: column; align-items: center; line-height: 1; }
    .score-inline-label { font-size: 13px; font-weight: 700; }
    .score-inline-val { font-size: 32px; font-weight: 800; }

    /* ---------- radial area ---------- */
    .radial-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    svg { width: 100%; height: 100%; display: block; touch-action: none; }

    .seg-line { stroke: var(--blue-dark); stroke-width: 1.4; }
    .seg-num  { font-size: 19px; font-weight: 600; fill: var(--text);
      text-anchor: middle; dominant-baseline: central; }
    .seg-hit  { fill: #ffce3a; stroke: #b8860b; stroke-width: 2; }
    .seg-num-active { font-size: 21px; font-weight: 800; fill: #1a1a1a; }
    .bubble   { fill: var(--green-bub); stroke: #1d5a20; stroke-width: 2; }
    .bubble-active { fill: #3aa33f; stroke: #0f3d12; stroke-width: 3; }
    .bubble-text { fill: #fff; font-size: 14px; font-weight: 700;
      text-anchor: middle; dominant-baseline: central; }
    .center-num { fill: var(--text); font-size: 60px; font-weight: 700;
      text-anchor: middle; dominant-baseline: central; }

    /* ---------- footer ---------- */
    .back {
      align-self: center; background: var(--blue-dark); color: #fff; border: none;
      border-radius: 14px; padding: 9px 34px; font-size: 17px; font-weight: 700;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="frame">

    <!-- ===== header scoreboard ===== -->
    <div class="scoreboard">
      <div class="sb-title">Best of AB sets</div>

      <div class="side-left">
        <div style="font-size:13px;">Opponent</div>
        <div class="opp-name">XXX</div>
        <div class="sub">XXX (96)</div>
        <div class="sub">XXX (93)</div>
      </div>

      <div class="center-col">
        <div class="legbox" title="legs / sets">
          <span class="l">AA</span><span class="r">BB</span>
          <span class="l">aa</span><span class="r">bb</span>
        </div>
        <div class="score-inline">
          <span class="score-inline-label">Score:</span>
          <span class="score-inline-val" id="scoreVal">–</span>
        </div>
      </div>

      <div class="side-right">
        <button class="esc">esc</button>
        <div style="font-size:13px; margin-top:6px;">Player:</div>
        <div class="player-name">XXX</div>
        <div class="sub">XXX (96)</div>
        <div class="sub">XXX (93)</div>
        <div class="sub">XXX (90)</div>
      </div>
    </div>

    <!-- ===== radial scorer (generated by JS) ===== -->
    <div class="radial-wrap">
      <svg id="scorer" viewBox="0 0 600 790" aria-label="radial score selector"></svg>
    </div>

    <!-- ===== footer ===== -->
    <button class="back">&lt;-- BACK</button>
  </div>

  <script>
  // =========================================================================
  //  TUNING CONSTANTS  — tweak these, refresh, re-check on the phone.
  //  Geometry is parametric so the whole dial reshapes from here.
  // =========================================================================
  const T = {
    cx: 300, cy: 395,          // dial center within the 600x790 viewBox

    // outer number ring (ellipse) — measured, then +20% wider / +10% taller
    ringOuterRx: 298, ringOuterRy: 384,   // outer edge of the blue band
    ringInnerRx: 157, ringInnerRy: 266,   // inner edge of the blue band (= green disc edge)
    numRx: 227, numRy: 325,               // where the 20 numbers sit (mid-band)
    segCount: 20,                          // exact values shown per range
    startAngleDeg: -90,                    // first segment at top, going clockwise

    // green inner disc — narrow + tall (big blue band), per the picture
    discRx: 157, discRy: 266,
    bubbleR: 48,                           // bubble radius
    bubbleCount: 10,
  };

  // The 10 score ranges. 0-9 is the rarely-used centre bubble (labeled "0").
  // All other buckets are 20 values wide: lower half on the left ring arc,
  // upper half on the right arc, both reading bottom-to-top.
  const RANGES = [
    "0-9",
    "10-29","30-49","50-69","70-89",
    "90-109","110-129","130-149","150-169","170-180"
  ];

  // Bubble centres (viewBox coords). Centre bubble + 9 outer at ~40° intervals.
  // Bottom pair spread wider so adjacent bubbles don't overlap (r=44).
  const BUBBLE_POS = [
    { x: 300, y: 450 },  // 0-9     (centre)
    { x: 300, y: 332 },  // 10-29
    { x: 384, y: 261 },  // 30-49
    { x: 409, y: 395 },  // 50-69
    { x: 386, y: 527 },  // 70-89
    { x: 300, y: 613 },  // 90-109  (bottom of disc, centre)
    { x: 300, y: 177 },  // 110-129 (top of disc, centre)
    { x: 214, y: 527 },  // 130-149
    { x: 191, y: 395 },  // 150-169
    { x: 216, y: 261 },  // 170-180
  ];

  // How far out (normalized to the number ring = 1.0) the finger must be to
  // count as "selecting a segment". Below this = inner/dead zone = no value.
  const SELECT_THRESHOLD = 0.80;
  const GRAB_SLOP = 1.35;   // bubble tap forgiveness multiplier

  // --- live interaction state ---
  const STATE = {
    activeRange: null,   // index 0..8 of the range whose values fill the ring
    dragging: false,
    previewIdx: null,    // ring segment under the finger (0..19) or null
    lastScore: null,     // last committed score (Phase 2: just displayed/logged)
  };

  // =========================================================================
  const svg = document.getElementById("scorer");
  const scoreEl = document.getElementById("scoreVal");
  const NS = "http://www.w3.org/2000/svg";
  const deg = d => d * Math.PI / 180;
  const step  = 360 / T.segCount;       // angle per ring segment
  const bstep = 360 / T.bubbleCount;    // angle per range bubble

  function el(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  // point on an ellipse at angle a (deg), measured clockwise from top
  function ptOnEllipse(rx, ry, aDeg) {
    const a = deg(aDeg);
    return { x: T.cx + rx * Math.cos(a), y: T.cy + ry * Math.sin(a) };
  }
  function bubbleCenter(i) { return BUBBLE_POS[i]; }
  // intersection point of line (p1,p2) and line (p3,p4)
  function lineIntersect(p1, p2, p3, p4) {
    const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
    const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
    return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
  }

  // exact values for the active range, e.g. 40..59
  function rangeValues(idx) {
    if (idx == null) return [];
    const [lo, hi] = RANGES[idx].split("-").map(Number);
    const vals = [];
    for (let v = lo; v <= hi; v++) vals.push(v);
    return vals;
  }

  // Map a flat sorted vals array onto the 20 ring segments so that:
  //   left arc  (i=10..19, bottom→top) carries the lower half of vals
  //   right arc (i=9..0,   bottom→top) carries the upper half of vals
  // Returns a 20-element array; slots with no value stay null.
  function buildSegmentValues(vals) {
    const result = new Array(T.segCount).fill(null);
    const half = Math.floor(vals.length / 2);
    for (let j = 0; j < Math.min(half, 10); j++) {
      result[10 + j] = vals[j];        // left: i=10=bottom … i=19=upper-left
    }
    const rightLen = vals.length - half;
    for (let j = 0; j < Math.min(rightLen, 10); j++) {
      result[9 - j] = vals[half + j];  // right: i=9=near-bottom … i=0=top
    }
    return result;
  }

  // ----- pointer → SVG viewBox coordinates -----
  function toLocal(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  // which range bubble (if any) is under a point
  function bubbleAt(p) {
    for (let i = 0; i < T.bubbleCount; i++) {
      const c = bubbleCenter(i);
      if (Math.hypot(p.x - c.x, p.y - c.y) <= T.bubbleR * GRAB_SLOP) return i;
    }
    return null;
  }
  // which ring segment (if any) a point maps to — normalized so the ellipse
  // is treated as a circle, giving correct angular sectors.
  function segmentAt(p) {
    const nx = (p.x - T.cx) / T.numRx;
    const ny = (p.y - T.cy) / T.numRy;
    const r  = Math.hypot(nx, ny);
    if (r < SELECT_THRESHOLD) return null;          // inner / dead zone
    let aDeg = Math.atan2(ny, nx) * 180 / Math.PI;  // clockwise-from-top frame
    let idx  = Math.round((aDeg - T.startAngleDeg) / step);
    return ((idx % T.segCount) + T.segCount) % T.segCount;
  }

  // =========================== RENDER =====================================
  function render() {
    svg.innerHTML = "";
    const vals = rangeValues(STATE.activeRange);

    // 1) blue outer band
    svg.appendChild(el("ellipse", {
      cx: T.cx, cy: T.cy, rx: T.ringOuterRx, ry: T.ringOuterRy,
      fill: "var(--blue-ring)", stroke: "var(--blue-dark)", "stroke-width": 2
    }));

    // 2) segment divider lines (masked by the green disc next)
    for (let i = 0; i < T.segCount; i++) {
      const a = T.startAngleDeg + i * step - step / 2;
      const p = ptOnEllipse(T.ringOuterRx, T.ringOuterRy, a);
      svg.appendChild(el("line", { x1: T.cx, y1: T.cy, x2: p.x, y2: p.y, class: "seg-line" }));
    }

    // 3) green inner disc
    svg.appendChild(el("ellipse", {
      cx: T.cx, cy: T.cy, rx: T.discRx, ry: T.discRy,
      fill: "var(--green-disc)", stroke: "var(--blue-dark)", "stroke-width": 2
    }));

    // 4) exact-value numbers — bottom-to-top on each arc half.
    //    Left arc (i=10..19) carries the lower half of vals; right arc (i=9..0)
    //    carries the upper half. Segments with no value are skipped.
    const segVals = buildSegmentValues(vals);
    for (let i = 0; i < T.segCount; i++) {
      if (segVals[i] == null) continue;
      const a  = T.startAngleDeg + i * step;
      const a1 = a - step / 2, a2 = a + step / 2;
      const iL = ptOnEllipse(T.ringInnerRx, T.ringInnerRy, a1);
      const iR = ptOnEllipse(T.ringInnerRx, T.ringInnerRy, a2);
      const oL = ptOnEllipse(T.ringOuterRx, T.ringOuterRy, a1);
      const oR = ptOnEllipse(T.ringOuterRx, T.ringOuterRy, a2);
      const midL = { x: (iL.x + oL.x) / 2, y: (iL.y + oL.y) / 2 };
      const midR = { x: (iR.x + oR.x) / 2, y: (iR.y + oR.y) / 2 };
      const midI = { x: (iL.x + iR.x) / 2, y: (iL.y + iR.y) / 2 };
      const midO = { x: (oL.x + oR.x) / 2, y: (oL.y + oR.y) / 2 };
      const p    = lineIntersect(midL, midR, midI, midO);
      const selected = STATE.dragging && STATE.previewIdx === i;
      if (selected) svg.appendChild(el("circle", { cx: p.x, cy: p.y, r: 23, class: "seg-hit" }));
      svg.appendChild(el("text", {
        x: p.x, y: p.y, class: selected ? "seg-num seg-num-active" : "seg-num"
      }, segVals[i]));
    }

    // 5) range bubbles
    for (let i = 0; i < T.bubbleCount; i++) {
      const p = bubbleCenter(i);
      svg.appendChild(el("circle", {
        cx: p.x, cy: p.y, r: T.bubbleR,
        class: i === STATE.activeRange ? "bubble bubble-active" : "bubble"
      }));
      const parts = RANGES[i].split("-");
      const t = el("text", { x: p.x, y: p.y, class: "bubble-text" });
      if (parts.length === 1 || (parts[0] === "0" && parts[1] === "9")) {
        // 0-9 bucket: show just "0"
        t.appendChild(el("tspan", { x: p.x, dy: "0" }, "0"));
      } else {
        t.appendChild(el("tspan", { x: p.x, dy: "-0.35em" }, parts[0] + "-"));
        t.appendChild(el("tspan", { x: p.x, dy: "1.1em" }, parts[1]));
      }
      svg.appendChild(t);
    }

    // 6) score readout now lives in the box ABOVE the dial (centre stays empty)
    let scoreTxt = "–";
    if (STATE.dragging) {
      const v = (STATE.previewIdx != null) ? segVals[STATE.previewIdx] : null;
      scoreTxt = (v != null) ? String(v) : "–";
    } else if (STATE.lastScore != null) scoreTxt = String(STATE.lastScore);
    scoreEl.textContent = scoreTxt;
  }

  // =========================== GESTURE ====================================
  svg.addEventListener("pointerdown", (e) => {
    const p = toLocal(e);
    const b = bubbleAt(p);
    if (b == null) return;            // only a range bubble starts a throw
    e.preventDefault();
    try { svg.setPointerCapture(e.pointerId); } catch {}
    STATE.activeRange = b;
    STATE.dragging = true;
    STATE.previewIdx = null;
    render();
  });

  svg.addEventListener("pointermove", (e) => {
    if (!STATE.dragging) return;
    e.preventDefault();
    const idx = segmentAt(toLocal(e));
    if (idx !== STATE.previewIdx) { STATE.previewIdx = idx; render(); }
  });

  function endDrag(e) {
    if (!STATE.dragging) return;
    const segVals = buildSegmentValues(rangeValues(STATE.activeRange));
    const committed = (STATE.previewIdx != null) ? segVals[STATE.previewIdx] : null;
    if (committed != null) {
      STATE.lastScore = committed;
      console.log("COMMIT score:", STATE.lastScore);
      if (navigator.vibrate) navigator.vibrate(15);   // haptic on commit (Android; iOS ignores)
    } else {
      console.log("CANCEL (released in dead zone or empty segment)");
    }
    STATE.dragging = false;
    STATE.previewIdx = null;
    try { svg.releasePointerCapture(e.pointerId); } catch {}
    render();
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  // stop iOS long-press from popping a callout / cancelling the drag
  svg.addEventListener("contextmenu", (e) => e.preventDefault());

  render();
  </script>
</body>
</html>
